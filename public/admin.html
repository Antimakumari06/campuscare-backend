
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>CampusCare Admin Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
<style>
body{margin:0;font-family:Arial;background:#f4f4f4;}
.sidebar{width:220px;height:100vh;background:#343a40;color:white;position:fixed;padding-top:20px;z-index:10;}
.sidebar h4{text-align:center;margin-bottom:30px;}
.sidebar a{display:block;color:white;padding:12px 20px;text-decoration:none;}
.sidebar a:hover{background:#495057;}
.sidebar a.active{background:#0d6efd;}
.main{margin-left:220px;padding:20px;}
.card{border-radius:10px;box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.chart-container{display:flex;justify-content:center;gap:40px;flex-wrap:wrap;margin-top:20px;}
.chart-box{width:350px;height:350px;}

/* JWT Badge */
.jwt-badge{display:inline-flex;align-items:center;gap:6px;background:#d1fae5;color:#065f46;padding:4px 12px;border-radius:20px;font-size:12px;font-weight:600;}
.session-timer{font-size:12px;color:#6b7280;margin-left:4px;}

/* Bell Icon */
.bell-wrap{position:relative;cursor:pointer;margin-left:8px;}
.bell-icon{font-size:1.4rem;transition:transform 0.2s;}
.bell-wrap:hover .bell-icon{transform:rotate(20deg);}
.notif-count{
    position:absolute;top:-6px;right:-6px;
    background:#e23744;color:white;
    font-size:10px;font-weight:700;
    width:18px;height:18px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    opacity:0;transform:scale(0);
    transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
}
.notif-count.show{opacity:1;transform:scale(1);}

/* Notification Panel */
.notif-panel{
    position:fixed;top:70px;right:24px;
    width:340px;max-height:420px;overflow-y:auto;
    background:white;border-radius:16px;
    box-shadow:0 8px 40px rgba(0,0,0,0.18);
    z-index:1000;
    transform:translateY(-10px) scale(0.97);
    opacity:0;pointer-events:none;
    transition:all 0.25s cubic-bezier(0.34,1.2,0.64,1);
}
.notif-panel.open{transform:translateY(0) scale(1);opacity:1;pointer-events:all;}
.notif-header{padding:16px 20px;border-bottom:1px solid #f0f0f0;display:flex;justify-content:space-between;align-items:center;}
.notif-header span{font-weight:700;font-size:0.95rem;}
.notif-clear{font-size:12px;color:#e23744;cursor:pointer;font-weight:600;}
.notif-clear:hover{text-decoration:underline;}
.notif-item{
    padding:14px 20px;border-bottom:1px solid #fafafa;
    animation:slideIn 0.3s ease;
    cursor:pointer;transition:background 0.15s;
}
.notif-item:hover{background:#fef2f2;}
.notif-item.unread{background:#fff8f8;border-left:3px solid #e23744;}
.notif-title{font-weight:600;font-size:0.875rem;color:#1a1a2e;}
.notif-desc{font-size:0.8rem;color:#6b7280;margin-top:3px;}
.notif-time{font-size:0.72rem;color:#9ca3af;margin-top:4px;}
.notif-empty{padding:40px 20px;text-align:center;color:#9ca3af;font-size:0.875rem;}

/* Toast */
.toast-container{
    position:fixed;bottom:28px;right:28px;
    display:flex;flex-direction:column;gap:10px;
    z-index:9999;
}
.toast-notif{
    background:#1a1a2e;color:white;
    padding:14px 18px;border-radius:12px;
    display:flex;align-items:flex-start;gap:12px;
    min-width:300px;max-width:360px;
    box-shadow:0 8px 32px rgba(0,0,0,0.25);
    transform:translateX(120%);opacity:0;
    transition:all 0.4s cubic-bezier(0.34,1.2,0.64,1);
}
.toast-notif.show{transform:translateX(0);opacity:1;}
.toast-icon{font-size:1.4rem;flex-shrink:0;}
.toast-body .toast-title{font-weight:700;font-size:0.875rem;margin-bottom:3px;}
.toast-body .toast-msg{font-size:0.8rem;opacity:0.8;}
.toast-close{margin-left:auto;cursor:pointer;opacity:0.6;font-size:0.9rem;flex-shrink:0;}
.toast-close:hover{opacity:1;}

/* Socket status */
.socket-dot{width:8px;height:8px;border-radius:50%;background:#6b7280;display:inline-block;margin-right:4px;transition:background 0.3s;}
.socket-dot.connected{background:#22c55e;box-shadow:0 0 6px #22c55e;}
.socket-status{font-size:11px;color:#6b7280;display:flex;align-items:center;}

@keyframes slideIn{from{opacity:0;transform:translateX(20px);}to{opacity:1;transform:translateX(0);}}
@keyframes bellShake{0%,100%{transform:rotate(0);}20%{transform:rotate(-15deg);}40%{transform:rotate(15deg);}60%{transform:rotate(-10deg);}80%{transform:rotate(10deg);}}
.bell-shake{animation:bellShake 0.5s ease;}
</style>
</head>
<body>

<!-- Sidebar -->
<div class="sidebar">
  <h4>CampusCare</h4>
  <a class="active" href="#">📊 Dashboard</a>
  <a href="#">📋 Complaints</a>
  <a href="#">📈 Analytics</a>
  <a href="#">⚙ Settings</a>
</div>

<!-- Main -->
<div class="main">

  <!-- Navbar -->
  <nav class="navbar navbar-light bg-white shadow-sm mb-4">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h5">Admin Panel</span>
    <div class="d-flex align-items-center gap-2">

      <!-- Socket status -->
      <div class="socket-status">
        <span class="socket-dot" id="socketDot"></span>
        <span id="socketStatus">Connecting...</span>
      </div>

      <span class="jwt-badge">🔐 JWT Secured</span>
      <span class="session-timer" id="sessionTimer">08:00:00</span>

      <!-- Bell Icon -->
      <div class="bell-wrap" onclick="toggleNotifPanel()">
        <span class="bell-icon" id="bellIcon">🔔</span>
        <div class="notif-count" id="notifCount">0</div>
      </div>

      <button onclick="logout()" class="btn btn-outline-danger btn-sm ms-2">Logout</button>
    </div>
  </div>
  </nav>

  <h2 class="mb-4">📊 Admin Dashboard</h2>

  <div class="container-fluid">
    <div class="row mb-3">
    <div class="col-md-4">
      <input type="text" id="searchBox" class="form-control" placeholder="Search complaints..." onkeyup="searchComplaints()">
    </div>
    </div>

    <div class="row text-center mb-4">
      <div class="col-md-4"><div class="card p-3"><h5>Total Complaints</h5><h2 id="totalCount">0</h2></div></div>
      <div class="col-md-4"><div class="card p-3"><h5>Pending</h5><h2 id="pendingCount" class="text-danger">0</h2></div></div>
      <div class="col-md-4"><div class="card p-3"><h5>Resolved</h5><h2 id="resolvedCount" class="text-success">0</h2></div></div>
    </div>

    <div class="card p-3">
      <h4 class="text-center">Complaint Analytics</h4>
      <div class="chart-container">
        <div class="chart-box"><canvas id="pieChart"></canvas></div>
        <div class="chart-box"><canvas id="barChart"></canvas></div>
      </div>
    </div>

    <div class="card p-3 mt-4">
      <h4 class="text-center">Complaint Category Analytics</h4>
      <div style="width:600px;margin:auto;"><canvas id="categoryChart"></canvas></div>
    </div>

    <br>
    <div id="complaints" class="row"></div>
  </div>
</div>

<!-- Notification Panel -->
<div class="notif-panel" id="notifPanel">
  <div class="notif-header">
    <span>🔔 Notifications</span>
    <span class="notif-clear" onclick="clearNotifications()">Clear all</span>
  </div>
  <div id="notifList">
    <div class="notif-empty">No notifications yet</div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toastContainer"></div>

<script>
const API_URL = "http://localhost:5000";
let pieChart, barChart, categoryChart, allComplaints = [];
let notifications = [];
let unreadCount = 0;
let notifPanelOpen = false;

// ── Auth ────────────────────────────────────────────────────
function getToken(){ return localStorage.getItem("adminToken"); }
function authHeader(){ return {"Content-Type":"application/json","Authorization":`Bearer ${getToken()}`}; }
function isTokenExpired(t){ try{ const p=JSON.parse(atob(t.split(".")[1])); return Date.now()>=p.exp*1000; }catch{ return true; } }

(function checkAuth(){
  const token = getToken();
  if(!token){ window.location.href="login.html"; return; }
  if(isTokenExpired(token)){ localStorage.removeItem("adminToken"); alert("Session expired."); window.location.href="login.html"; return; }
  startSessionTimer();
})();

function startSessionTimer(){
  const token=getToken();
  const payload=JSON.parse(atob(token.split(".")[1]));
  const expiresAt=payload.exp*1000;
  setInterval(()=>{
    const rem=expiresAt-Date.now();
    if(rem<=0){ localStorage.removeItem("adminToken"); alert("Session expired."); window.location.href="login.html"; return; }
    const h=Math.floor(rem/3600000), m=Math.floor((rem%3600000)/60000), s=Math.floor((rem%60000)/1000);
    document.getElementById("sessionTimer").textContent=`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;
  },1000);
}

function logout(){ localStorage.removeItem("adminToken"); localStorage.removeItem("admin"); window.location.href="login.html"; }


// ── Socket.IO ────────────────────────────────────────────────
const socket = io(API_URL);

socket.on("connect", () => {
  console.log("Socket connected ✅");
  document.getElementById("socketDot").classList.add("connected");
  document.getElementById("socketStatus").textContent = "Live";
});

socket.on("disconnect", () => {
  document.getElementById("socketDot").classList.remove("connected");
  document.getElementById("socketStatus").textContent = "Offline";
});

// 🔔 NEW COMPLAINT received in real-time
socket.on("newComplaint", (complaint) => {
  console.log("New complaint received!", complaint);

  // Add to complaints list
  allComplaints.unshift(complaint);
  renderComplaints(allComplaints);

  // Show toast notification
  showToast(
    "🚨 New Complaint!",
    `${complaint.name} — ${complaint.issue}`,
    "alert"
  );

  // Add to notification panel
  addNotification(complaint);

  // Shake bell
  shakeBell();

  // Play sound
  playAlertSound();
});

// Status updated in real-time
socket.on("statusUpdated", ({ id, status }) => {
  const c = allComplaints.find(x => x._id === id);
  if(c){ c.status = status; renderComplaints(allComplaints); }
});

// Complaint deleted in real-time
socket.on("complaintDeleted", ({ id }) => {
  allComplaints = allComplaints.filter(x => x._id !== id);
  renderComplaints(allComplaints);
});


// ── Sound Alert ──────────────────────────────────────────────
function playAlertSound(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [523, 659, 784].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = freq;
      osc.type = "sine";
      gain.gain.setValueAtTime(0.3, ctx.currentTime + i * 0.15);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.15 + 0.3);
      osc.start(ctx.currentTime + i * 0.15);
      osc.stop(ctx.currentTime + i * 0.15 + 0.3);
    });
  } catch(e){ console.log("Sound not supported"); }
}


// ── Bell Shake ───────────────────────────────────────────────
function shakeBell(){
  const bell = document.getElementById("bellIcon");
  bell.classList.add("bell-shake");
  setTimeout(() => bell.classList.remove("bell-shake"), 600);
}


// ── Notification Panel ───────────────────────────────────────
function addNotification(complaint){
  unreadCount++;
  notifications.unshift({
    id: complaint._id,
    name: complaint.name,
    issue: complaint.issue,
    description: complaint.description,
    time: new Date(),
    read: false
  });

  // Update badge
  const badge = document.getElementById("notifCount");
  badge.textContent = unreadCount > 9 ? "9+" : unreadCount;
  badge.classList.add("show");

  renderNotifPanel();
}

function renderNotifPanel(){
  const list = document.getElementById("notifList");
  if(notifications.length === 0){
    list.innerHTML = '<div class="notif-empty">No notifications yet</div>';
    return;
  }
  list.innerHTML = notifications.map(n => `
    <div class="notif-item ${n.read ? "" : "unread"}" onclick="markRead('${n.id}')">
      <div class="notif-title">🚨 ${n.issue}</div>
      <div class="notif-desc">From: ${n.name} — ${n.description.substring(0,60)}${n.description.length>60?"...":""}</div>
      <div class="notif-time">${timeAgo(n.time)}</div>
    </div>
  `).join("");
}

function markRead(id){
  const n = notifications.find(x => x.id === id);
  if(n && !n.read){ n.read = true; unreadCount = Math.max(0, unreadCount-1); }
  updateBadge();
  renderNotifPanel();
}

function updateBadge(){
  const badge = document.getElementById("notifCount");
  badge.textContent = unreadCount > 9 ? "9+" : unreadCount;
  if(unreadCount === 0) badge.classList.remove("show");
}

function clearNotifications(){
  notifications = []; unreadCount = 0;
  updateBadge();
  renderNotifPanel();
}

function toggleNotifPanel(){
  notifPanelOpen = !notifPanelOpen;
  document.getElementById("notifPanel").classList.toggle("open", notifPanelOpen);
  if(notifPanelOpen){
    notifications.forEach(n => n.read = true);
    unreadCount = 0;
    updateBadge();
    renderNotifPanel();
  }
}

// Close panel on outside click
document.addEventListener("click", (e) => {
  const panel = document.getElementById("notifPanel");
  const bell  = document.querySelector(".bell-wrap");
  if(notifPanelOpen && !panel.contains(e.target) && !bell.contains(e.target)){
    notifPanelOpen = false;
    panel.classList.remove("open");
  }
});

function timeAgo(date){
  const sec = Math.floor((Date.now()-new Date(date))/1000);
  if(sec<60) return "just now";
  if(sec<3600) return `${Math.floor(sec/60)}m ago`;
  return `${Math.floor(sec/3600)}h ago`;
}


// ── Toast ────────────────────────────────────────────────────
function showToast(title, msg, type="info"){
  const container = document.getElementById("toastContainer");
  const toast = document.createElement("div");
  toast.className = "toast-notif";
  toast.innerHTML = `
    <span class="toast-icon">${type==="alert"?"🚨":"✅"}</span>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      <div class="toast-msg">${msg}</div>
    </div>
    <span class="toast-close" onclick="this.parentElement.remove()">✕</span>
  `;
  container.appendChild(toast);
  requestAnimationFrame(() => { requestAnimationFrame(() => toast.classList.add("show")); });
  setTimeout(() => { toast.classList.remove("show"); setTimeout(() => toast.remove(), 400); }, 4000);
}


// ── Load Complaints ──────────────────────────────────────────
async function loadComplaints(){
  try{
    const res = await fetch(`${API_URL}/complaints`, { headers: authHeader() });
    if(res.status===401||res.status===403){ localStorage.removeItem("adminToken"); window.location.href="login.html"; return; }
    const data = await res.json();
    allComplaints = data;
    renderComplaints(data);
    updateCategoryChart(data);
  } catch(err){ console.log("Backend Error", err); }
}

function renderComplaints(data){
  const c=document.getElementById("complaints");
  c.innerHTML="";
  const total=data.length;
  const pending=data.filter(x=>x.status==="Pending").length;
  const resolved=data.filter(x=>x.status==="Resolved").length;
  document.getElementById("totalCount").innerText=total;
  document.getElementById("pendingCount").innerText=pending;
  document.getElementById("resolvedCount").innerText=resolved;
  updateCharts(pending,resolved);
  data.forEach(x=>{
    c.innerHTML+=`<div class="col-md-6"><div class="card p-3 mb-3">
      <h5>${x.issue}</h5>
      <p><b>Name:</b> ${x.name}</p>
      <p><b>Description:</b> ${x.description}</p>
      <p><b>Status:</b> <span class="badge ${x.status==="Resolved"?"bg-success":"bg-danger"}">${x.status}</span></p>
      ${x.status==="Pending"?`<button class="btn btn-success btn-sm w-100 mb-2" onclick="updateStatus('${x._id}')">✅ Resolve</button>`:""}
      <button class="btn btn-danger btn-sm w-100" onclick="deleteComplaint('${x._id}')">🗑️ Delete</button>
    </div></div>`;
  });
}

function searchComplaints(){
  const t=document.getElementById("searchBox").value.toLowerCase();
  renderComplaints(allComplaints.filter(c=>c.issue.toLowerCase().includes(t)||c.name.toLowerCase().includes(t)||c.description.toLowerCase().includes(t)));
}

function updateCharts(pending,resolved){
  if(pieChart)pieChart.destroy();
  if(barChart)barChart.destroy();
  pieChart=new Chart(document.getElementById("pieChart").getContext("2d"),{type:"pie",data:{labels:["Pending","Resolved"],datasets:[{data:[pending,resolved],backgroundColor:["#ff4d4d","#28a745"]}]}});
  barChart=new Chart(document.getElementById("barChart").getContext("2d"),{type:"bar",data:{labels:["Pending","Resolved"],datasets:[{label:"Complaints",data:[pending,resolved],backgroundColor:["#ff4d4d","#28a745"]}]}});
}

function updateCategoryChart(data){
  let cat={WiFi:0,Fan:0,Washroom:0,Electricity:0,Other:0};
  data.forEach(c=>{const i=c.issue.toLowerCase();if(i.includes("wifi"))cat.WiFi++;else if(i.includes("fan"))cat.Fan++;else if(i.includes("washroom"))cat.Washroom++;else if(i.includes("electricity"))cat.Electricity++;else cat.Other++;});
  if(categoryChart)categoryChart.destroy();
  categoryChart=new Chart(document.getElementById("categoryChart").getContext("2d"),{type:"bar",data:{labels:Object.keys(cat),datasets:[{label:"By Category",data:Object.values(cat),backgroundColor:["#007bff","#ffc107","#dc3545","#28a745","#6c757d"]}]}});
}

async function updateStatus(id){
  const res=await fetch(`${API_URL}/complaint/${id}`,{method:"PUT",headers:authHeader(),body:JSON.stringify({status:"Resolved"})});
  if(res.status===401||res.status===403){window.location.href="login.html";return;}
  showToast("✅ Resolved!","Complaint marked as resolved.","success");
}

async function deleteComplaint(id){
  if(!confirm("Delete this complaint?"))return;
  const res=await fetch(`${API_URL}/complaint/${id}`,{method:"DELETE",headers:authHeader()});
  if(res.status===401||res.status===403){window.location.href="login.html";return;}
}

window.onload = loadComplaints;
</script>
</body>
</html>
